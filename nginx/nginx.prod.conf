# nginx de PRODUCCIÓN (docker-compose.prod.yml): API Gateway + entrada única de la app.
#   /api/       -> backend:4000 (se quita el prefijo /api)
#   /meta/      -> backend:4000 (webhook de Meta, ruta intacta: la firma HMAC usa el body crudo)
#   /socket.io/ -> backend:4000 (pedidos en tiempo real: Kanban y KDS)
#   /uploads/menu/ -> archivos estáticos del volumen backend_uploads (fotos de platos)
#   /           -> frontend:3000 (Next.js)
# El tráfico público entra por cloudflared -> nginx:80 dentro de koval_network.

# Protocolo original: llega por el túnel de Cloudflare como https; conservarlo
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Cabecera Connection correcta para WebSockets y para peticiones normales
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# DNS interno de Docker. Con "resolve", nginx vuelve a resolver los nombres cuando cambian:
# al recrear backend/frontend (docker compose up --build) cambian de IP y, sin esto,
# nginx seguiría usando la IP vieja hasta reiniciarse (502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream koval_backend_upstream {
    zone koval_backend_upstream 64k;
    server backend:4000 resolve;
    keepalive 16;
}

upstream koval_frontend_upstream {
    zone koval_frontend_upstream 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    # Dominio principal + subdominios de restaurantes: Next.js (src/proxy.ts) decide con el Host
    server_name _;

    server_tokens off;
    # PDFs de menú (importación con IA) y payloads de Meta
    client_max_body_size 20m;

    # IP real del visitante: cloudflared envía CF-Connecting-IP. Solo se confía en ella si la
    # petición viene de la red interna de Docker (el contenedor cloudflared), para que no se
    # pueda falsificar. La usa el rate limit de pedidos públicos.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # API REST del backend
    location /api/ {
        proxy_pass http://koval_backend_upstream/;
        proxy_set_header Connection "";
    }

    # Webhook de Meta (sin cambios de ruta)
    location /meta/ {
        proxy_pass http://koval_backend_upstream/meta/;
        proxy_set_header Connection "";
    }

    # WebSockets de pedidos en tiempo real
    location /socket.io/ {
        proxy_pass http://koval_backend_upstream/socket.io/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Fotos de platos subidas desde el dashboard (volumen backend_uploads montado en solo lectura).
    # Solo se publica uploads/menu/: el resto de uploads (ej. PDFs de menú) no se expone.
    # Nombres únicos (uuid) => caché larga e inmutable.
    location /uploads/menu/ {
        alias /usr/share/nginx/uploads/menu/;
        autoindex off;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Todo lo demás: Next.js (dashboard, KDS, menús públicos por subdominio)
    location / {
        proxy_pass http://koval_frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
