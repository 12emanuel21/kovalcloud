# Protocolo original: si llega por el túnel de Cloudflare (https), conservarlo
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    # Dominio principal + subdominios de restaurantes (pizzeria-napoles.localhost).
    # "_" acepta además cualquier otro host (ej. la URL del túnel *.trycloudflare.com).
    # Next.js (src/proxy.ts) decide con la cabecera Host qué mostrar.
    server_name localhost *.localhost _;

    # IP real del cliente detrás del túnel de Cloudflare (cloudflared envía CF-Connecting-IP).
    # Solo se confía en esa cabecera si la petición viene de la red interna de Docker
    # (el contenedor cloudflared), para que no se pueda falsificar desde fuera.
    # Sin esto, todos los visitantes del túnel compartirían IP y el rate limit de pedidos.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Enrutar tráfico principal al Frontend (Next.js)
    location / {
        proxy_pass http://koval_frontend:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # Host original: Next.js lo usa para detectar el subdominio del restaurante
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # Webhook de Meta (sin cambios de ruta)
    location /meta/ {
        proxy_pass http://koval_backend:4000/meta/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # WebSockets de pedidos en tiempo real (sin cambios de ruta)
    location /socket.io/ {
        proxy_pass http://koval_backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # API REST del backend
    location /api/ {
        proxy_pass http://koval_backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}
