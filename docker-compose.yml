services:
  postgres:
    image: postgres:15
    container_name: koval_postgres
    restart: always
    environment:
      POSTGRES_USER: koval_admin
      POSTGRES_PASSWORD: koval_password_123
      POSTGRES_DB: koval_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - koval_network

  koval_backend:
    build:
      context: ./backend_koval
    container_name: koval_backend
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./backend_koval:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://koval_admin:koval_password_123@postgres:5432/koval_db?schema=public
      - JWT_SECRET=koval_cloud_super_secret_jwt_key_2026_x99
      - JWT_EXPIRES_IN=7d
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - WHATSAPP_SERVICE_URL=http://koval_baileys:5000/send
    networks:
      - koval_network
    depends_on:
      - postgres

  whatsapp_baileys:
    build: 
      context: ./whatsapp_service
    container_name: koval_baileys
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./whatsapp_service:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - NESTJS_WEBHOOK_URL=http://koval_backend:4000/meta/webhook
    networks:
      - koval_network
    depends_on:
      - koval_backend

  koval_frontend:
    build: 
      context: ./frontend_koval
    container_name: koval_frontend
    restart: always
    ports:
      - "3030:3030"
    volumes:
      - ./frontend_koval:/app
      - /app/node_modules
      - /app/.next
    networks:
      - koval_network
    depends_on:
      - koval_backend

  nginx:
    image: nginx:alpine
    container_name: koval_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - koval_network
    depends_on:
      - koval_frontend
      - koval_backend

volumes:
  postgres_data:

networks:
  koval_network:
    driver: bridge
